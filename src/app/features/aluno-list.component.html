<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Lista de Alunos</h2>
    <a routerLink="/novo" class="btn btn-primary">
      + Novo Aluno
    </a>
  </div>

  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Email</th>
        <th>Matrícula</th>
        <th>Curso</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      @for (aluno of alunos; track aluno.id) {
        <tr>
          <td>{{ aluno.id }}</td>
          <td>{{ aluno.nome }}</td>
          <td>{{ aluno.email }}</td>
          <td>{{ aluno.matricula }}</td>
          <td>{{ aluno.curso }}</td>
          <td>
            <a [routerLink]="['/editar', aluno.id]" class="btn btn-warning btn-sm me-2">
              Editar
            </a>
            <button (click)="deletarAluno(aluno.id!)" class="btn btn-danger btn-sm">
              Excluir
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6" class="text-center">Nenhum aluno cadastrado.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
