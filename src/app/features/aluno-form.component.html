<div class="container mt-4">
  <div class="card">
    <div class="card-header bg-primary text-white">
      <h3>{{ isEditMode ? 'Editar Aluno' : 'Cadastrar Aluno' }}</h3>
    </div>
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        
        <div class="mb-3">
          <label class="form-label">Nome Completo</label>
          <input type="text" class="form-control" formControlName="nome" placeholder="Ex: João Silva">
        </div>

        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" class="form-control" formControlName="email" placeholder="Ex: joao@email.com">
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Matrícula</label>
            <input type="text" class="form-control" formControlName="matricula">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Curso</label>
            <input type="text" class="form-control" formControlName="curso">
          </div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success" [disabled]="form.invalid">
            {{ isEditMode ? 'Atualizar' : 'Salvar' }}
          </button>
          <a routerLink="/" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
